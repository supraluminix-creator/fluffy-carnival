name: prodsafe-core

on:
  push:
    branches: [ main, feat/*, feature/*, chore/*, fix/* ]
  pull_request:
    branches: [ main ]

jobs:
  core-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core-min.txt
          pip install pytest

      - name: Secret scan (heuristic)
        run: |
          python tools/secret_scan.py --fail-on-find || (echo "Secret scan found issues" && exit 1)

      - name: Run CLI (mock)
        run: |
          python cli_core.py run --mock

      - name: Quick unit test
        run: |
          python -m pytest -q tests/test_export_utils_min.py
