name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx_mock
      - name: Lint (ruff)
        run: |
          # Expand Ruff scope to include pipeline first; keep Flake8/Mypy unchanged
          python -m ruff check scheduler api pipeline
      - name: Lint (flake8)
        run: |
          # Limit lint scope initially to keep CI green; expand gradually
          python -m flake8 scheduler api
      - name: Type-check (mypy)
        run: |
          # Limit type-check scope initially; expand progressively alongside lint
          python -m mypy scheduler api
      - name: Run tests
        run: pytest -q
