name: CI

on:
  push:
    branches: [ main, '**/copilot/**', '**/feature/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-and-type:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install mypy ruff

      - name: Ruff (lint)
        run: ruff check .

      - name: Mypy
        run: |
          mypy --cache-dir .mypy_cache .

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pip-audit
      - name: pip-audit
        run: |
          pip-audit --progress-spinner off

  bandit:
    runs-on: ubuntu-latest
    needs: [lint-and-type]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit
      - name: Bandit security scan
        run: |
          bandit -q -r pipeline scheduler api -ll -ii

  tests:
    runs-on: ubuntu-latest
    needs: [lint-and-type, security, bandit]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio pytest-cov

      - name: Pytest
        env:
          PYTHONPATH: .
        run: pytest --maxfail=1

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
            name: coverage-xml
            path: coverage.xml
            if-no-files-found: warn

  codecov:
    runs-on: ubuntu-latest
    needs: [tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-xml
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: true
          verbose: true

  summary:
    runs-on: ubuntu-latest
    needs: [lint-and-type, security, tests]
    if: always()
    steps:
      - name: CI Result
        run: |
          if [ "${{ needs.lint-and-type.result }}" = "success" ] && [ "${{ needs.tests.result }}" = "success" ]; then
            echo "All checks passed ✅";
          else
            echo "Some checks failed ❌"; exit 1; fi
