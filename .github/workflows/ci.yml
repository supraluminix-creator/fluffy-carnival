name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Lint (ruff)
        run: |
          # Enforced Ruff scope (Phase 2): add pipeline collectors
          python -m ruff check api scheduler pipeline/collectors main.py
      - name: Lint (ruff full project - non blocking)
        continue-on-error: true
        run: |
          # Full-project Ruff scan for visibility; does not fail CI yet
            python -m ruff check .
      - name: Type-check (mypy)
        run: |
          # Limit type-check scope initially; expand progressively alongside lint
          python -m mypy scheduler api
      - name: Run tests
        run: pytest -q
