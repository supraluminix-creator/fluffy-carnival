name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Cache mypy
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('**/pyproject.toml') }}-${{ hashFiles('**/*.py') }}
          restore-keys: |
            mypy-${{ runner.os }}-${{ hashFiles('**/pyproject.toml') }}-
            mypy-${{ runner.os }}-
      - name: Lint with ruff
        run: |
          python -m ruff check scheduler api pipeline
      - name: Type-check with mypy
        run: |
          python -m mypy scheduler api pipeline

  security:
    runs-on: ubuntu-latest
    continue-on-error: true  # Non-blocking initially
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit
      - name: Security audit
        run: |
          pip-audit --desc --format=json --output=security-report.json || true
          pip-audit --desc

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -v

  summary:
    needs: [lint-and-type, security, tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check job results
        run: |
          echo "Lint and Type: ${{ needs.lint-and-type.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "Tests: ${{ needs.tests.result }}"
          if [ "${{ needs.lint-and-type.result }}" != "success" ] || [ "${{ needs.tests.result }}" != "success" ]; then
            echo "Required jobs failed"
            exit 1
          fi
          echo "All required checks passed!"
