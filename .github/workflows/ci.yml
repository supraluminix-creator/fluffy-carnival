name: CI

on:
  push:
    branches: [ main, '**/copilot/**', '**/feature/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-and-type:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install mypy ruff

      - name: Ruff (lint)
        run: ruff check .

      - name: Mypy
        run: mypy .

  tests:
    runs-on: ubuntu-latest
    needs: lint-and-type
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio

      - name: Pytest
        env:
          PYTHONPATH: .
        run: pytest -q --maxfail=1

  summary:
    runs-on: ubuntu-latest
    needs: [lint-and-type, tests]
    if: always()
    steps:
      - name: CI Result
        run: |
          if [ "${{ needs.lint-and-type.result }}" = "success" ] && [ "${{ needs.tests.result }}" = "success" ]; then
            echo "All checks passed ✅";
          else
            echo "Some checks failed ❌"; exit 1; fi
