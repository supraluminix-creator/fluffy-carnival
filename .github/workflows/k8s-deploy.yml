name: K8s Deploy

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'k8s/**'
      - 'ml/**'
      - 'api/**'
      - 'pipeline/**'
      - 'pyproject.toml'
      - 'requirements*.txt'
  pull_request:
    branches: [ main ]
    paths:
      - 'k8s/**'
      - 'ml/**'
      - 'api/**'
      - 'pipeline/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-core.txt
        pip install -r requirements-minimal.txt

    - name: Run tests
      run: |
        python -m pytest tests/ -v --cov=. --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install ruff mypy

    - name: Run ruff linter
      run: ruff check .

    - name: Run mypy type checker
      run: mypy api pipeline scheduler integrations --ignore-missing-imports

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  build-and-push:
    runs-on: ubuntu-latest
    needs: [test, lint, security-scan]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure kubectl
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}

    - name: Deploy to staging
      run: |
        # Update image tag in k8s deployment
        sed -i 's|image:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop-${{ github.sha }}|' k8s/k8s_deployment.yaml

        # Apply k8s manifests
        kubectl apply -f k8s/k8s_deployment.yaml
        kubectl apply -f k8s/service.yaml
        kubectl apply -f k8s/ingress.yaml
        kubectl apply -f k8s/configmap.yaml

        # Wait for rollout to complete
        kubectl rollout status deployment/crypto-prodsafe --timeout=600s

        # Run smoke tests
        kubectl run smoke-test --image=curlimages/curl --rm -i --restart=Never -- curl -f http://crypto-prodsafe-service/health

  deploy-production:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure kubectl
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBE_CONFIG_PRODUCTION }}

    - name: Deploy to production (blue-green)
      run: |
        # Create blue deployment
        sed -i 's|name: crypto-prodsafe|name: crypto-prodsafe-blue|' k8s/k8s_deployment.yaml
        sed -i 's|app: crypto-prodsafe|app: crypto-prodsafe-blue|' k8s/k8s_deployment.yaml
        sed -i 's|image:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-${{ github.sha }}|' k8s/k8s_deployment.yaml

        kubectl apply -f k8s/k8s_deployment.yaml

        # Wait for blue deployment
        kubectl rollout status deployment/crypto-prodsafe-blue --timeout=600s

        # Switch traffic to blue (update service selector)
        kubectl patch service crypto-prodsafe-service -p '{"spec":{"selector":{"app":"crypto-prodsafe-blue"}}}'

        # Wait for traffic switch
        sleep 30

        # Run production smoke tests
        kubectl run prod-smoke-test --image=curlimages/curl --rm -i --restart=Never -- curl -f http://crypto-prodsafe-service/health

        # If successful, scale down green (old) deployment
        kubectl scale deployment crypto-prodsafe --replicas=0

        # Clean up old blue deployment name references
        kubectl delete deployment crypto-prodsafe-blue --ignore-not-found=true

  rollback:
    runs-on: ubuntu-latest
    if: failure() && (needs.deploy-staging.result == 'failure' || needs.deploy-production.result == 'failure')
    steps:
    - name: Configure kubectl
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBE_CONFIG }}

    - name: Rollback deployment
      run: |
        # Rollback to previous deployment
        kubectl rollout undo deployment/crypto-prodsafe

        # Restore service selector if needed
        kubectl patch service crypto-prodsafe-service -p '{"spec":{"selector":{"app":"crypto-prodsafe"}}}'
