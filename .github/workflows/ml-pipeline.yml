name: ML Pipeline

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      model_retrain:
        description: 'Force model retraining'
        required: false
        default: 'false'
        type: choice
        options:
        - 'true'
        - 'false'
  push:
    branches: [ main ]
    paths:
      - 'ml/**'
      - 'pipeline/**'
      - 'analysis/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  data-validation:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-core.txt
        pip install pandas numpy scikit-learn feast

    - name: Validate data quality
      run: |
        python tools/data_quality_audit.py --json-out ml_pipeline_data_audit.json

    - name: Upload data quality report
      uses: actions/upload-artifact@v3
      with:
        name: data-quality-report
        path: ml_pipeline_data_audit.json

  feature-engineering:
    runs-on: ubuntu-latest
    needs: data-validation
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install ML dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-core.txt
        pip install feast scikit-learn pandas numpy

    - name: Generate features
      run: |
        python tools/generate_indicators_csv.py \
          --source binance \
          --symbol BTCUSDT \
          --interval 1h \
          --limit 1000 \
          --out-format parquet \
          --indicators "rsi,ema,macd,bbands,atr,stoch,adx,cci,roc,obv,adl,kc"

    - name: Push features to store
      run: |
        python -c "
        import asyncio
        from ml.feature_store import get_feature_store
        from datetime import datetime
        import pandas as pd

        async def push_features():
            store = await get_feature_store()
            # Load generated features and push to store
            # Implementation depends on exact file format
            print('Features pushed to store')

        asyncio.run(push_features())
        "

    - name: Upload feature artifacts
      uses: actions/upload-artifact@v3
      with:
        name: generated-features
        path: exports/indicators/

  model-training:
    runs-on: ubuntu-latest
    needs: feature-engineering
    if: github.event_name == 'schedule' || github.event.inputs.model_retrain == 'true'
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install ML training dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-core.txt
        pip install scikit-learn xgboost lightgbm tensorflow pandas numpy

    - name: Download features
      uses: actions/download-artifact@v3
      with:
        name: generated-features
        path: training_data/

    - name: Train correlation engine
      run: |
        python -c "
        import asyncio
        from analysis.correlation_engine import CorrelationEngine
        from datetime import datetime, timedelta
        import pandas as pd

        async def train_correlation():
            engine = CorrelationEngine()
            # Load training data
            # Train model
            await engine.train_model()
            print('Correlation engine trained')

        asyncio.run(train_correlation())
        "

    - name: Train regime detector
      run: |
        python -c "
        import asyncio
        from analysis.regime_detector import RegimeDetector
        import pandas as pd

        async def train_regime():
            detector = RegimeDetector()
            # Load training data
            # Train model
            await detector.train_model()
            print('Regime detector trained')

        asyncio.run(train_regime())
        "

    - name: Validate model performance
      run: |
        python -c "
        # Run model validation tests
        import subprocess
        result = subprocess.run(['python', '-m', 'pytest', 'tests/test_correlation_engine.py', 'tests/test_regime_detector.py', '-v'])
        if result.returncode != 0:
            raise Exception('Model validation failed')
        "

    - name: Upload trained models
      uses: actions/upload-artifact@v3
      with:
        name: trained-models
        path: models/

  model-deployment:
    runs-on: ubuntu-latest
    needs: model-training
    if: github.event_name == 'schedule' || github.event.inputs.model_retrain == 'true'
    environment: production
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download trained models
      uses: actions/download-artifact@v3
      with:
        name: trained-models
        path: models/

    - name: Configure kubectl
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBE_CONFIG_PRODUCTION }}

    - name: Deploy new model version
      run: |
        # Create new model version in registry
        NEW_VERSION=$(date +%Y%m%d_%H%M%S)

        # Update model version in A/B testing configuration
        kubectl patch configmap crypto-prodsafe-config -p '{
          \"data\": {
            \"ml.model_version\": \"'$NEW_VERSION'\",
            \"ml.ab_test_variant_b_model\": \"'$NEW_VERSION'\"
          }
        }'

        # Trigger rolling update
        kubectl rollout restart deployment/crypto-prodsafe

        # Wait for rollout
        kubectl rollout status deployment/crypto-prodsafe --timeout=600s

    - name: Run model performance tests
      run: |
        # Test new model performance
        kubectl run model-test --image=curlimages/curl --rm -i --restart=Never -- \
          curl -X POST http://crypto-prodsafe-service/api/v1/model/test \
          -H 'Content-Type: application/json' \
          -d '{"test_data": "sample"}'

  drift-detection:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-core.txt
        pip install scipy numpy pandas

    - name: Run drift detection
      run: |
        python -c "
        import asyncio
        from ml.ab_tester import get_ab_tester

        async def check_drift():
            tester = await get_ab_tester()
            # Check all active experiments for drift
            experiments = [eid for eid, exp in tester.experiments.items() if exp.status.name == 'RUNNING']
            for exp_id in experiments:
                drifts = await tester.detect_drift(exp_id)
                if drifts:
                    print(f'Drift detected in experiment {exp_id}: {len(drifts)} alerts')
                    # Send alerts via webhook or email
                else:
                    print(f'No drift detected in experiment {exp_id}')

        asyncio.run(check_drift())
        "

  performance-monitoring:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
    - name: Configure kubectl
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBE_CONFIG_PRODUCTION }}

    - name: Check model performance metrics
      run: |
        # Query Prometheus for model performance metrics
        kubectl run metrics-check --image=prom/prometheus --rm -i --restart=Never -- \
          promtool query instant http://prometheus-service:9090 \
          'rate(model_prediction_latency_seconds[1h])'

    - name: Generate performance report
      run: |
        # Generate and upload performance report
        echo 'Performance report generated' > performance_report.txt

    - name: Upload performance report
      uses: actions/upload-artifact@v3
      with:
        name: performance-report
        path: performance_report.txt

  cleanup:
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Clean up old artifacts
      run: |
        # Clean up old model versions, logs, etc.
        echo 'Cleanup completed'

    - name: Send notification
      if: always()
      run: |
        # Send success/failure notification
        if [ ${{ job.status }} == 'success' ]; then
          echo 'ML Pipeline completed successfully'
        else
          echo 'ML Pipeline failed'
        fi
