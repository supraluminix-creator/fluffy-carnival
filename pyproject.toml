[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",  # pycodestyle
  "F",  # pyflakes
  "I",  # import sorting
  "UP", # pyupgrade
  "B",  # bugbear
  "SIM",# simplifications
  "PERF" # performance hints
]
ignore = [
  # Allow long lines up to 120 (configured via line-length). We do not ignore E501 so Ruff will flag >120.
]

# Per-file ignores for legacy modules scheduled for later cleanup
[tool.ruff.lint.per-file-ignores]
"pipeline/reporter.py" = [
  "E101", "E117", "W191", # mixed tabs/spaces / over-indent
  "E501"                    # extremely long lines kept until refactor
]
"pipeline/exporter.py" = ["W191", "E101", "E117", "E501"]
"pipeline/orchestrator.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["pipeline", "scheduler", "api"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
skip-magic-trailing-comma = false
line-ending = "auto"

# Flake8 retained temporarily (will be removed from CI soon). Mirrors Ruff line length.
# Flake8 removed (redundant with Ruff). Historical config deleted to avoid drift.

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = true
warn_unused_configs = true
strict_optional = false
check_untyped_defs = true
no_implicit_optional = true
exclude = ["^\\.venv/", "^build/", "^dist/"]
mypy_path = ["typings"]
namespace_packages = true

[[tool.mypy.overrides]]
module = ["scheduler.*"]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["api.*"]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pipeline.collectors.defillama"]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pipeline.collectors.txcount"]
disallow_untyped_defs = true

# Future tightening roadmap (not yet enabled):
# disallow_untyped_defs = true
# disallow_incomplete_defs = true
# enable_error_code = true