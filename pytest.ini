[pytest]
testpaths = tests
asyncio_mode = auto
pythonpath = .

# Profil complet par défaut (CI): couverture + seuil.
# Pour un cycle dev rapide on pourra utiliser: pytest -m quick --no-cov (ou variable env).
# On retire --cov-fail-under ici et laissons la CI (workflow) l'ajouter via commande dédiée,
# afin de ne pas bloquer les runs filtrés.
addopts = --maxfail=1 --disable-warnings --cov=pipeline --cov=main --cov-config=.coveragerc --cov-report=term-missing --cov-report=xml

markers =
	quick: tests rapides sans dépendances externes lourdes ni I/O massives

# NOTE: Pour forcer le seuil localement: ajouter --cov-fail-under=75 en ligne de commande.
