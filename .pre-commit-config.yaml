repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.8  # pin to specific version
    hooks:
      - id: ruff
        name: ruff (lint)
        args: ["--fix"]
      - id: ruff-format
        name: ruff (format)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        name: mypy (scheduler, api, collectors)
        additional_dependencies: ["types-PyYAML", "types-requests"]
        args: ["--config-file=pyproject.toml", "scheduler", "api"]
  - repo: local
    hooks:
      - id: secret-scan
        name: secret-scan (heuristic)
        entry: python tools/secret_scan.py --fail-on-find
        language: system
        pass_filenames: false
        stages: [commit]
