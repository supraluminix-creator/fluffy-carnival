# YAML-driven scheduler config (ProdSafe)
# Use dotted path 'package.module:callable' for functions
jobs:
  - id: macro
    every: 5m
    func: pipeline.collectors.market:fetch_macro
    enabled: true
    args: ["bitcoin"]
    kwargs:
      cmc_api_key: ${CMC_API_KEY}
  - id: defillama
    every: 15m
    func: pipeline.collectors.defillama:fetch_defillama_tvl
    enabled: true
    args: ["ethereum"]
  - id: onchain_tx
    every: 30m
    func: pipeline.collectors.onchain:fetch_txcount
    enabled: true
    args: ["BTC"]
    kwargs:
      etherscan_api_key: ${ETHERSCAN_API_KEY}
  - id: onchain_hashrate
    every: 30m
    func: pipeline.collectors.onchain:fetch_hashrate
    enabled: true
    args: ["BTC"]
  - id: onchain_sopr
    every: 30m
    func: pipeline.collectors.onchain:fetch_sopr
    enabled: true
    args: ["BTC"]
  - id: derivatives_oi
    every: 5m
    func: pipeline.collectors.derivatives:fetch_bybit_oi
    enabled: true
    args: ["BTCUSDT"]
  - id: derivatives_lsr
    every: 5m
    func: pipeline.collectors.derivatives:fetch_bybit_long_short_ratio
    enabled: true
    args: ["BTCUSDT"]
  - id: sentiment_fg
    every: 1h
    func: pipeline.collectors.sentiment:fetch_fear_greed
    enabled: true
  - id: export_batch
    every: 5m
    func: pipeline.export_job:perform_export_batch
    enabled: true
    # Utilise RUN_ID, CMC_API_KEY, ETHERSCAN_API_KEY depuis l'environnement

  - id: flush_liq
    every: 2m
    func: pipeline.flush_jobs:flush_bybit_liquidations
    enabled: true
    # Flush opportuniste du buffer WS (si même process). Sans effet sinon.

